<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mielőtt felébredtem - Könyv Drop Progress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #f3f3f3;
            --accent-color: #d4af37;
            --bg-dark: #0a0a0a;
            --text-muted: #a0a0a0;
            --progress-bg: rgba(255, 255, 255, 0.08);
            --progress-fill: linear-gradient(90deg, #d4af37 0%, #f5d76e 50%, #d4af37 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--primary-color);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 10, 10, 0.95) 0%, rgba(20, 20, 20, 0.8) 100%);
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .book-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 3rem;
        }

        .cover-wrapper {
            position: relative;
            margin-bottom: 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cover-wrapper:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .cover-image {
            width: 280px;
            height: auto;
            border-radius: 4px;
            display: block;
        }

        .glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            z-index: -1;
            border-radius: 4px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            color: var(--accent-color);
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .author {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 2rem;
            font-style: italic;
        }

        .trilogy-badge {
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
            border: 1px solid var(--accent-color);
            border-radius: 50px;
            font-size: 0.9rem;
            color: var(--accent-color);
            display: inline-block;
        }

        .progress-section {
            width: min(720px, 100%);
            margin-top: 1rem;
        }

        .progress-topline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .progress-percent {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 1rem;
        }

        .progress-track {
            position: relative;
            width: 100%;
            height: 22px;
            background: var(--progress-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.06);
        }

        .progress-fill {
            width: 22%;
            height: 100%;
            border-radius: 999px;
            background: var(--progress-fill);
            position: relative;
            overflow: hidden;
            transition: width 1s ease;
            box-shadow: 0 0 18px rgba(212, 175, 55, 0.45);
        }

        .progress-fill::after {
            content: "";
            position: absolute;
            top: 0;
            left: -40%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
            animation: shimmer 1.8s infinite;
        }

        @keyframes shimmer {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        .progress-note {
            margin-top: 1rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-10vh) translateX(100px); opacity: 0; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .cover-image { width: 220px; }
            .progress-topline { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="background-overlay"></div>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="book-section">
            <div class="cover-wrapper">
                <div class="glow"></div>
                <img src="c03770d5-31c6-4d38-9662-13bd555c7385.png" alt="Mielőtt felébredtem borító" class="cover-image">
            </div>

            <p class="subtitle">Hamarosan érkezik</p>
            <h1>Mielőtt felébredtem</h1>
            <p class="author">Farkas Gergő</p>
            <div class="trilogy-badge">Egy trilógia első része</div>
        </div>

        <div class="progress-section">
            <div class="progress-topline">
                <span>Előrehaladás</span>
                <span class="progress-percent" id="progressText">22%</span>
            </div>
            <div class="progress-track" aria-label="Kiadási előrehaladás">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-note">Jelenleg szerkesztés alatt.</div>
        </div>
    </div>

    <script>
        const targetDate = new Date("2026-05-15T00:00:00").getTime();
        const startPercent = 22;

        function updateProgress() {
            const now = new Date().getTime();
            const startDate = targetDate - 7 * 24 * 60 * 60 * 1000;
            const totalDuration = targetDate - startDate;
            const elapsed = now - startDate;

            let progress = startPercent + (elapsed / totalDuration) * (100 - startPercent);
            progress = Math.max(startPercent, Math.min(100, progress));

            document.getElementById("progressFill").style.width = progress.toFixed(2) + "%";
            document.getElementById("progressText").innerText = Math.round(progress) + "%";

            if (progress >= 100) {
                document.getElementById("progressText").innerText = "100%";
            }
        }

        updateProgress();
        setInterval(updateProgress, 1000);

        const particlesContainer = document.getElementById('particles');
        const particleCount = 20;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';

            const size = Math.random() * 5 + 2 + 'px';
            particle.style.width = size;
            particle.style.height = size;

            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = Math.random() * 10 + 15 + 's';
            particle.style.animationDelay = Math.random() * 20 + 's';

            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
