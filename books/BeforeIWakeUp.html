<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mielőtt felébredtem - Könyv Drop Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #f3f3f3;
            --accent-color: #d4af37; /* Goldish accent */
            --bg-dark: #0a0a0a;
            --text-muted: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--primary-color);
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 10, 10, 0.95) 0%, rgba(20, 20, 20, 0.8) 100%);
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .book-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 3rem;
        }

        .cover-wrapper {
            position: relative;
            margin-bottom: 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cover-wrapper:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .cover-image {
            width: 280px;
            height: auto;
            border-radius: 4px;
            display: block;
        }

        .glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            z-index: -1;
            border-radius: 4px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            color: var(--accent-color);
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .author {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 2rem;
            font-style: italic;
        }

        /* Countdown Styles */
        .countdown-container {
            display: flex;
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 12px;
            min-width: 120px;
            transition: all 0.3s ease;
        }

        .countdown-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-color);
        }

        .number {
            display: block;
            font-size: 3rem;
            font-weight: 600;
            line-height: 1;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
        }

        .trilogy-badge {
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
            border: 1px solid var(--accent-color);
            border-radius: 50px;
            font-size: 0.9rem;
            color: var(--accent-color);
            display: inline-block;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .countdown-container { gap: 0.5rem; flex-wrap: wrap; justify-content: center; }
            .countdown-item { min-width: 80px; padding: 1rem; }
            .number { font-size: 2rem; }
            .cover-image { width: 220px; }
        }

        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-10vh) translateX(100px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="background-overlay"></div>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="book-section">
            <div class="cover-wrapper">
                <div class="glow"></div>
                <img src="c03770d5-31c6-4d38-9662-13bd555c7385.png" alt="Mielőtt felébredtem borító" class="cover-image">
            </div>
            
            <p class="subtitle">Hamarosan érkezik</p>
            <h1>Mielőtt felébredtem</h1>
            <p class="author">Farkas Gergő</p>
            <div class="trilogy-badge">Egy trilógia első része</div>
        </div>

        <div class="countdown-container">
            <div class="countdown-item">
                <span class="number" id="days">00</span>
                <span class="label">Nap</span>
            </div>
            <div class="countdown-item">
                <span class="number" id="hours">00</span>
                <span class="label">Óra</span>
            </div>
            <div class="countdown-item">
                <span class="number" id="minutes">00</span>
                <span class="label">Perc</span>
            </div>
            <div class="countdown-item">
                <span class="number" id="seconds">00</span>
                <span class="label">Másodperc</span>
            </div>
        </div>
    </div>

    <script>
        // Set the countdown date
        const countDownDate = new Date("May 8, 2026 23:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');

            if (distance < 0) {
                clearInterval(x);
                document.querySelector(".countdown-container").innerHTML = "<h2>MÁR ELÉRHETŐ!</h2>";
            }
        }

        // Update every second
        const x = setInterval(updateCountdown, 1000);
        updateCountdown();

        // Add some floating particles for effect
        const particlesContainer = document.getElementById('particles');
        const particleCount = 20;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 5 + 2 + 'px';
            particle.style.width = size;
            particle.style.height = size;
            
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = Math.random() * 10 + 15 + 's';
            particle.style.animationDelay = Math.random() * 20 + 's';
            
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
